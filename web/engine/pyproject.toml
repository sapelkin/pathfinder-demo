[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfinder_engine"
version = "0.1.0"
description = "Pathfinder's models: the waiting-room simulation, the triage rules, the follow-up ranker and the right-door search."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["pathfinder_engine"]

[tool.setuptools.package-data]
pathfinder_engine = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: the 8-week calibration run"]
