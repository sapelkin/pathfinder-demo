name: pages

# Builds the site from source and deploys it to GitHub Pages: the Python engine runs in the browser under Pyodide,
# so there is no server. One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine tests
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pytest ./web/engine
          pytest -q web/engine -m "not slow"
      - name: Build the engine wheel
        run: pip wheel web/engine --no-deps -w web/engine/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
        working-directory: web/app
      - name: Build the site
        run: npm run build
        working-directory: web/app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: cp web/app/dist/index.html web/app/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
